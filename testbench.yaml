laravel: './workbench'

providers:
  - Eclipse\Common\Workbench\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Eclipse\Common\Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    views: false
  build:
    - asset-publish
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
